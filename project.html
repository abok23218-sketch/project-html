<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Example</title>
</head>
<body>

    <h1>Welcome To My Web</h1>
    <p>This is an exam of an HTML form <u> with</u> containing <mark > وفيه various input controls:</p>

    <form>
       
        <fieldset>
            <legend>User Information</legend>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <br>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>
        </fieldset>

        <br>

        
        <fieldset>
            <legend>Contact Information</legend>
            <div>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <br>
            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="40"></textarea>
            </div>
        </fieldset>

        <br>

      
        <fieldset>
            <legend>Subscription</legend>
            <div>
                <label>
                    Subscribe to newsletter: <input type="checkbox" name="newsletter1">
                </label>
            </div>
            <div>
                <label>
                    Subscribe also here: <input type="checkbox" name="newsletter2">
                </label>
            </div>
        </fieldset>

        <br>

        <fieldset>
            <legend>Preferred Language</legend>
            <div>
                <label for="language">Select your preferred language:</label>
                <select id="language" name="language">
                    <option value="english">English</option>
                    <option value="spanish">Spanish</option>
                    <option value="french">French</option>
                    <option value="german">German</option>
                </select>
            </div>
        </fieldset>

        <br>

      
        <fieldset>
            <legend>Feedback</legend>
            <div>
                <label for="rating">Rate our service:</label>
                <input type="range" id="rating" name="rating">
            </div>
        </fieldset>

        <br>

      
        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>

</body>
</html>
